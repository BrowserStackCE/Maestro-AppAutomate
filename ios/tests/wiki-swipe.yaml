# wiki-swipe.yaml
# Swipes through the onboarding pager (3 swipes) and asserts
# that the CONTINUE button changes to GET STARTED on the last page.

appId: com.demo.wikipedia
---
- launchApp:
    clearState: true

# Dismiss notification permission dialog if it appears
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd:
          timeout: 2000

# Swipe left across the Explore feed to reveal more content (via reusable subflow).
- runFlow: common/functions/swipe.yaml

# Assert Get started button is visible on the last onboarding page
- assertVisible: "Get started"
- takeScreenshot: OnboardingLastPage
