# wiki-conditional-nestedFlows.yaml
# Scrolls to the Top read section conditionally — runs scrollFlow.yaml
# if the section is not yet visible after landing on the home screen.

appId: com.demo.wikipedia
---
- launchApp:
    clearState: true
- runFlow: subflows/skipOnboarding.yaml

# Dismiss the feed announcement card if present
- runFlow:
    when:
      visible: "Got it"
    commands:
      - tapOn: "Got it"

# Conditionally scroll down if On this day section is not yet visible
- runFlow:
    when:
      notVisible: "On this day"
    file: common/functions/scroll.yaml
- takeScreenshot: WikiConditional_TopReadReached
